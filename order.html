<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า | น้ำผึ้งแท้</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-order">

  <header class="site-header">
    <a class="site-logo" href="index.html">Honey</a>
    <nav class="site-nav" aria-label="เมนูหลัก">
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">สินค้า</a>
      <a href="order.html" aria-current="page">สั่งซื้อ</a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">สั่งซื้อสินค้า</h1>
    <p class="page-lead">กรอกรายละเอียดด้านล่าง ทางร้านจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>

    <form id="orderForm" class="order-form">
      <div class="form-group">
        <label for="customerName">ชื่อลูกค้า</label>
        <input type="text" id="customerName" name="customerName" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="contact">เบอร์โทร / Line</label>
        <input type="text" id="contact" name="contact" required>
      </div>

      <div class="form-group">
        <label for="items">รายการสินค้า</label>
        <textarea id="items" name="items" rows="4" required placeholder="เช่น น้ำผึ้งดอกลำไย 250g x 2"></textarea>
      </div>

      <div class="form-group">
        <label for="total">จำนวนเงินรวม (บาท)</label>
        <input type="number" id="total" name="total" min="0" step="1" required>
      </div>

      <div class="form-group">
        <label for="note">หมายเหตุ</label>
        <textarea id="note" name="note" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-outline">ยืนยันสั่งซื้อ</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; Honey. สงวนลิขสิทธิ์</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
